services:
  homeboard:
    build: .
    ports:
      - "${HOMEBOARD_BIND_IP:-127.0.0.1}:${HOMEBOARD_PORT:-8091}:8091"
    environment:
      HOMEBOARD_AUTH_MODE: ${HOMEBOARD_AUTH_MODE:-disabled}
      WEATHER_SOURCE: ${WEATHER_SOURCE:-open_meteo}
      WALKING_MINUTES: ${WALKING_MINUTES:-1}
      DRESSING_MINUTES: ${DRESSING_MINUTES:-10}
      SHOES_MINUTES: ${SHOES_MINUTES:-3}
      TRANSPORT_SOURCE: ${TRANSPORT_SOURCE:-ideska}
      BAKALARI_CONFIG_JSON: ${BAKALARI_CONFIG_JSON:-}
      SCHOOL_SOURCE: ${SCHOOL_SOURCE:-mock}
      GOOGLE_CALENDAR_CONFIG_JSON: ${GOOGLE_CALENDAR_CONFIG_JSON:-}
      CALENDAR_SOURCE: ${CALENDAR_SOURCE:-mock}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
