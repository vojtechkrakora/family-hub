# Standalone Container Manager project; do not merge with compose.yaml.
services:
  homeboard:
    build: .
    ports:
      - "${HOMEBOARD_BIND_IP:?Set HOMEBOARD_BIND_IP to the NAS private LAN IP}:${HOMEBOARD_PORT:-8091}:8091"
    environment:
      WALKING_MINUTES: ${WALKING_MINUTES:-1}
      DRESSING_MINUTES: ${DRESSING_MINUTES:-10}
      SHOES_MINUTES: ${SHOES_MINUTES:-3}
      TRANSPORT_SOURCE: ideska
      SCHOOL_SOURCE: bakalari
      CALENDAR_SOURCE: google_ics
      BAKALARI_CONFIG_FILE: /run/homeboard/bakalari.json
      GOOGLE_CALENDAR_CONFIG_FILE: /run/homeboard/calendar.json
    volumes:
      - type: bind
        source: ./.local
        target: /run/homeboard
        read_only: true
        bind:
          create_host_path: false
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
